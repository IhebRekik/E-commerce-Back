name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ Set up JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21

      # 3️⃣ Build Maven project to generate target/*.jar
      - name: Build with Maven
        run: mvn clean package -DskipTests

      # 4️⃣ Log in to GitHub Container Registry (using PAT)
      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      # 5️⃣ Build Docker image from repo root
      - name: Build Docker image
        run: docker build -t ghcr.io/ihebrekik/e-commerce-backend:latest .

      # 6️⃣ Push Docker image
      - name: Push Docker image
        run: docker push ghcr.io/ihebrekik/e-commerce-backend:latest
